<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Museumplein Podwalk</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --purple: #6606FF;
      --light-green: #e0f2e9;
      --text-dark: #1D1B20;
      --text-muted: #666;
      --ui-radius: 1rem;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    html, body {
      background-color: #000;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app-container {
      width: 100%;
      height: 100%;
      max-width: 26.875rem;
      position: relative;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #media-area {
      position: relative;
      flex-grow: 1;
      width: 100%;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.4s ease, background-image 0.4s ease;
      z-index: 1;
    }

    #bg-map { 
      background-image: url('map.jpg'); 
      opacity: 0; 
      pointer-events: none;
    }

    #top-ui-container {
      position: absolute;
      top: 1.25rem;
      left: 1rem;
      right: 1rem;
      z-index: 10;
      transition: opacity 0.4s ease;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #top-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--ui-radius);
      padding: 0.875rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-info p { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; margin-bottom: 0.125rem; }
    .top-info h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--text-dark); margin-bottom: 0.125rem; }
    .top-info span { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    
    .distance-indicator { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-width: 3.75rem;
    }
    
    .arrow-icon-container {
      height: 1.625rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.25rem;
    }

    .arrow-svg { transition: transform 0.8s ease-out; width: 1.125rem; height: auto; }
    .wobble { animation: radarWobble 2.5s infinite ease-in-out; }
    
    @keyframes radarWobble {
      0% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
      100% { transform: rotate(-15deg); }
    }

    .distance-text { font-size: 0.65rem; font-weight: 700; color: var(--purple); }

    .paginator {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 0.5rem 1rem;
      border-radius: 1.25rem;
      align-self: center;
    }

    .icon-btn {
      background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    
    .icon-btn svg { width: 1.25rem; height: auto; }

    #paginator-dots-container {
      display: flex;
      gap: 0.375rem;
      align-items: center;
    }

    .page-dot {
      width: 0.375rem;
      height: 0.375rem;
      background-color: #cbd5e1;
      border-radius: 50%;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .page-dot.active {
      width: 1rem;
      background-color: var(--purple);
      border-radius: 0.25rem;
    }

    #paginator-numbers {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-left: 0.375rem;
      margin-right: 0.25rem;
      font-family: 'Inter', sans-serif;
    }

    #canvas-layer {
      position: absolute;
      inset: 0;
      background: white;
      z-index: 5;
      display: none;
      flex-direction: column;
    }

    #canvas-layer.active { display: flex; }

    .canvas-tools {
      position: absolute;
      top: 2.5rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .color-swatches { display: flex; gap: 0.5rem; }
    .swatch { width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 0.125rem solid #e5e7eb; cursor: pointer; }
    
    .save-btn { 
      background: var(--purple); color: white; border: none; padding: 0.5rem 1.25rem; border-radius: 1.25rem; font-weight: 600; font-size: 0.9rem; cursor: pointer;
    }

    canvas { flex-grow: 1; width: 100%; display: block; touch-action: none; cursor: crosshair; }

    #pip-character {
      position: absolute;
      bottom: 1.25rem; 
      left: -0.625rem;
      width: 8.125rem;
      z-index: 10;
      pointer-events: none;
    }

    #map-toggle {
      position: absolute;
      bottom: 1.25rem; 
      right: 1rem;
      width: 2.875rem;
      height: 2.875rem;
      background-color: var(--purple);
      border-radius: 50%;
      z-index: 11;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      border: none;
      cursor: pointer;
      transition: opacity 0.3s ease, background-color 0.3s ease, color 0.3s ease;
    }

    #map-toggle svg { width: 1.375rem; height: auto; }

    #bottom-card {
      position: relative;
      width: 100%;
      background: #fff;
      border-top-left-radius: 1.5rem;
      border-top-right-radius: 1.5rem;
      z-index: 20;
      display: flex;
      flex-direction: column;
      flex-shrink: 0; 
      box-shadow: 0 -0.25rem 1.875rem rgba(0,0,0,0.1);
    }

    #collapsible-text {
      padding: 0 1.25rem;
      display: flex;
      flex-direction: column;
      height: 25vh;
      transition: height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
    }

    #collapsible-text.hidden { height: 0; }
    
    .lyrics-wrapper {
      position: relative;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin-top: 1.5rem;
    }

    .lyrics-container {
      position: relative; 
      overflow-y: auto;
      flex-grow: 1;
      padding-right: 0.25rem;
      padding-bottom: 1.875rem;
      padding-top: 0.625rem;
      overscroll-behavior: contain;
      mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    }

    .lyrics-container::-webkit-scrollbar { width: 0; }

    .lyric-line {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 0.75rem;
      transition: color 0.3s ease, transform 0.3s ease;
      cursor: pointer;
      transform-origin: left center;
    }

    .lyric-line.active { 
      color: var(--purple); 
      font-weight: 700; 
      transform: scale(1.02); 
    }

    .user-input-box {
      margin-bottom: 1rem;
      display: none;
      flex-shrink: 0;
      gap: 0.5rem;
    }

    .user-input-box.active { display: flex; }
    
    .user-input-box input {
      flex-grow: 1;
      padding: 0.75rem 1rem;
      border: 0.0625rem solid #e5e7eb;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      background: #f9fafb;
      outline: none;
    }

    .media-controls-wrapper { padding: 1rem 1.25rem 1.5rem; background: #fff; }

    .player-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      margin: 0 auto 1rem auto;
      background: var(--light-green); 
      border-radius: 2.5rem;
      padding: 0.375rem 0.75rem;
      width: max-content;
    }

    .skip-btn {
      background: transparent;
      border: none;
      width: 2.75rem;
      height: 2.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .skip-btn svg { width: 1.5rem; height: auto; }
    
    .play-btn { 
      background: var(--purple); 
      width: 3.25rem; 
      height: 3.25rem; 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      border: none;
      cursor: pointer;
    }

    .play-btn svg { width: 0.875rem; height: auto; }

    .player-timeline { display: flex; align-items: center; gap: 0.875rem; }
    
    .progress-track { flex-grow: 1; height: 0.375rem; background: #e5e7eb; border-radius: 0.1875rem; position: relative; cursor: pointer; }
    .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--purple); border-radius: 0.1875rem; pointer-events: none;}
    .progress-handle { width: 0.875rem; height: 0.875rem; background: var(--purple); border-radius: 50%; position: absolute; right: -0.4375rem; top: -0.25rem; pointer-events: auto; }
    
    .quote-btn { 
      background: var(--light-green);
      border: none; 
      width: 2.375rem; 
      height: 2.375rem; 
      border-radius: 0.5rem; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      cursor: pointer; 
    }

    .quote-btn svg { width: 1.25rem; height: auto; }
  </style>
</head>
<body>

<div id="app-container">
  
  <div id="media-area">
    <div id="bg-image" class="bg-layer"></div>
    <div id="bg-map" class="bg-layer"></div>

    <div id="canvas-layer">
      <div class="canvas-tools">
        <div class="color-swatches">
          <div class="swatch" style="background: #ef4444;" onclick="setColor('#ef4444')"></div>
          <div class="swatch" style="background: #eab308;" onclick="setColor('#eab308')"></div>
          <div class="swatch" style="background: #22c55e;" onclick="setColor('#22c55e')"></div>
          <div class="swatch" style="background: #3b82f6;" onclick="setColor('#3b82f6')"></div>
          <div class="swatch" style="background: #ffffff;" onclick="setColor('#ffffff')"></div>
          <div class="swatch" style="background: #000000; border-color: #000000;" onclick="setColor('#000000')"></div>
        </div>
        <button class="save-btn" onclick="completeTask()">Save</button>
      </div>
      <canvas id="drawing-pad"></canvas>
    </div>

    <!-- Paginator zit nu IN het top-ui-container blok, ONDER de header -->
    <div id="top-ui-container">
      <div id="top-card">
        <div class="top-info">
          <p id="ui-status">Walking towards</p>
          <h2 id="ui-title">Rijksmuseum garden</h2>
          <span id="ui-subtitle">Sheltered sculpture refuge</span>
        </div>
        <div class="distance-indicator">
          <div class="arrow-icon-container" id="arrow-container">
            <svg class="arrow-svg wobble" id="arrow-svg" viewBox="0 0 22 26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4.23572 24.0077C3.96357 24.7902 4.37724 25.6451 5.15968 25.9172C5.94213 26.1894 6.79706 25.7757 7.06921 24.9933L5.65247 24.5005L4.23572 24.0077ZM15.0027 0.847147C14.6419 0.101431 13.7448 -0.210581 12.9991 0.15025L0.846974 6.03032C0.101257 6.39115 -0.210754 7.28819 0.150076 8.0339C0.510907 8.77962 1.40794 9.09163 2.15366 8.7308L12.9556 3.50407L18.1823 14.306C18.5431 15.0517 19.4402 15.3637 20.1859 15.0029C20.9316 14.642 21.2436 13.745 20.8828 12.9993L15.0027 0.847147ZM5.65247 24.5005L7.06921 24.9933L15.0692 1.99327L13.6525 1.50049L12.2357 1.00771L4.23572 24.0077L5.65247 24.5005Z" fill="#6606FF"/>
            </svg>
          </div>
          <span class="distance-text" id="ui-distance">25 METER</span>
        </div>
      </div>
      
      <div class="paginator">
        <button class="icon-btn" onclick="prevStop()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M5.5 18V6H7.5V18H5.5ZM18.5 18L9.5 12L18.5 6V18Z" fill="#1D1B20"/>
          </svg>
        </button>
        <div id="paginator-dots-container"></div>
        <span id="paginator-numbers"></span>
        <button class="icon-btn" onclick="nextStop()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
            <path d="M16.5 18V6H18.5V18H16.5ZM5.5 18V6L14.5 12L5.5 18Z" fill="#1D1B20"/>
          </svg>
        </button>
      </div>
    </div>

    <svg id="pip-character" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="75" cy="85" r="45" fill="#6f7887"/>
      <path d="M40 90 Q15 95 30 115 Q60 110 70 95 Z" fill="#4d5563"/>
      <circle cx="85" cy="65" r="18" fill="#ffffff"/>
      <circle cx="89" cy="63" r="7" fill="#1e293b"/>
      <circle cx="115" cy="65" r="16" fill="#ffffff"/>
      <circle cx="117" cy="63" r="6" fill="#1e293b"/>
      <polygon points="102,74 135,79 105,89" fill="#f59e0b"/>
      <path d="M55 45 L115 35 L105 25 L65 32 Z" fill="#78350f"/>
    </svg>

    <button id="map-toggle">
      <svg viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.6666 8.50016L11.3333 2.8335L1.41663 8.50016V31.1668L11.3333 25.5002M22.6666 8.50016L32.5833 2.8335V25.5002L22.6666 31.1668L11.3333 25.5002M11.3333 25.5002V2.8335M22.6666 31.1668V8.50016" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div id="bottom-card">
    <div id="collapsible-text">
      <div class="lyrics-wrapper">
        <div class="lyrics-container" id="lyrics-container"></div>
      </div>
      <div class="user-input-box" id="user-input-box">
        <input type="text" placeholder="Type your observation here...">
        <button class="save-btn" onclick="completeTask()">Save</button>
      </div>
    </div>
    
    <div class="media-controls-wrapper">
      <div class="player-buttons">
        <button class="skip-btn" onclick="skipTime(-15)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 47" fill="none">

V31.7178Z" fill="#1D1B20"/>
          </svg>
        </button>
        <button class="play-btn" id="play-pause-btn" onclick="togglePlay()">
          <svg id="play-icon" viewBox="0 0 11 14" fill="none">
            <path d="M0 14V0L11 7L0 14Z" fill="white"/>
          </svg>
          <svg id="pause-icon" viewBox="0 0 12 14" fill="none" style="display: none;">
            <path d="M8 14V0H12V14H8ZM0 14V0H4V14H0Z" fill="white"/>
          </svg>
        </button>
        <button class="skip-btn" onclick="skipTime(15)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 47" fill="none">
            <path d="M39.9998 12.9932L25.2791 12.5039L28.2 7.81152C24.9531 6.61985 21.4233 6.38345 18.033 7.14941C14.2471 8.0048 10.8391 10.0613 8.31718 13.0117C5.7954 15.9623 4.2943 19.6495 4.03886 23.5225C3.78359 27.3954 4.78676 31.2478 6.89922 34.5039C9.01182 37.7599 12.1208 40.2467 15.7615 41.5918C19.4024 42.9368 23.3812 43.0692 27.1033 41.9688C30.8255 40.8682 34.0927 38.5931 36.4168 35.4844C38.7404 32.3761 39.9972 28.5995 39.9998 24.7188V22.8789C39.9998 21.7743 40.8952 20.8789 41.9998 20.8789C43.1043 20.879 43.9998 21.7744 43.9998 22.8789V24.7197C43.997 29.4636 42.4604 34.0803 39.6199 37.8799C36.7794 41.6793 32.7863 44.4596 28.2371 45.8047C23.688 47.1496 18.8256 46.9876 14.3758 45.3438C9.9259 43.6997 6.12587 40.6612 3.54375 36.6816C0.961749 32.702 -0.264325 27.9934 0.0476532 23.2598C0.359796 18.526 2.1939 14.0194 5.27617 10.4131C8.35846 6.80687 12.5238 4.29359 17.1512 3.24805C21.5657 2.25066 26.1752 2.63923 30.3523 4.35352L33.0633 0L39.9998 12.9932ZM30.6873 20.959H24.659L24.4842 23.3438C24.8073 23.2016 25.1374 23.0856 25.4734 22.9951C25.8094 22.9047 26.1972 22.8594 26.6365 22.8594C27.4635 22.8594 28.2259 23.0207 28.9236 23.3438C29.6344 23.6539 30.2032 24.1322 30.6297 24.7783C31.0689 25.4114 31.2888 26.2061 31.2889 27.1621C31.2889 28.1571 31.0558 29.0166 30.5906 29.7402C30.1384 30.4639 29.4986 31.0195 28.6717 31.4072C27.8575 31.7949 26.901 31.9893 25.8025 31.9893C24.6395 31.9892 23.6376 31.8015 22.7977 31.4268C21.9707 31.0391 21.2083 30.522 20.5105 29.876L22.449 27.6084C22.9918 28.0736 23.5286 28.4349 24.0584 28.6934C24.601 28.9517 25.1692 29.081 25.7635 29.0811C26.4484 29.0811 26.9852 28.9131 27.3728 28.5771C27.7733 28.2283 27.9734 27.7762 27.9734 27.2207C27.9734 26.8459 27.8772 26.5224 27.6834 26.251C27.4896 25.9797 27.2244 25.773 26.8885 25.6309C26.5525 25.4887 26.1647 25.418 25.7254 25.418C25.3248 25.418 24.9493 25.4755 24.6004 25.5918C24.2516 25.7081 23.9156 25.8572 23.5926 26.0381L21.5379 24.9141L21.9646 18.1289H30.7264L30.6873 20.959ZM18.4549 31.7178H15.1014V21.2109H12.2518V18.0322H18.4549V31.7178Z" fill="#1D1B20"/>
          </svg>
        </button>
      </div>

      <div class="player-timeline">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="ui-progress">
            <div class="progress-handle"></div>
          </div>
        </div>
        
        <button class="quote-btn" onclick="toggleText()">
          <svg viewBox="0 0 30 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M26.25 0C27.0519 6.88745e-05 27.7385 0.252955 28.3096 0.758789C28.8806 1.26465 29.166 1.87268 29.166 2.58301V18.083C29.166 18.7933 28.8807 19.4014 28.3096 19.9072C27.7385 20.4131 27.0519 20.6659 26.25 20.666H5.83301L0 25.833V2.58301C0 1.87268 0.285405 1.26466 0.856445 0.758789C1.42755 0.252955 2.11407 6.8273e-05 2.91602 0H26.25ZM8.47559 6.41504V10.6689H10.7998C10.7769 11.5061 10.5613 12.1772 10.1514 12.6816C9.72982 13.1862 9.04004 13.5798 8.08301 13.8623L9.02344 15.6182C10.0372 15.2953 10.8806 14.8512 11.5527 14.2861C12.2134 13.7211 12.6693 13.0852 12.9199 12.3789C13.1591 11.6726 13.2783 10.6989 13.2783 9.45801V6.41504H8.47559ZM16.4912 6.41504V10.6689H18.8154C18.7926 11.5063 18.5761 12.1772 18.166 12.6816C17.7445 13.1861 17.0554 13.5798 16.0986 13.8623L17.0381 15.6182C18.0635 15.2952 18.9066 14.8512 19.5674 14.2861C20.2281 13.7211 20.6839 13.0806 20.9346 12.3643C21.1738 11.658 21.2939 10.6889 21.2939 9.45801L21.293 6.41504H16.4912Z" fill="#1D1B20"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  const stopsData = {
    3: {
      id: 3, pageIndex: 3, title: "Rijksmuseum garden", subtitle: "Sheltered sculpture refuge",
      bgImage: "stop1.jpg", interaction: "text", taskTime: 25,
      audioSrc: "stop3_garden_mp3.mp3",
      lines: [
        { time: 0,  text: "Let's slow down for a moment while feeling the sun on your face." },
        { time: 4,  text: "There are stories hiding here, between the statues and the leaves of the trees." },
        { time: 9,  text: "Take a gentle breath." },
        { time: 11, text: "Can you notice a flower nearby, or perhaps the smell of plants and earth?" },
        { time: 16, text: "Now listen. Perhaps you can hear water flowing from the fountain, footsteps on gravel, or people talking quietly." },
        { time: 24, text: "If someone is drawing or painting, notice how carefully they’re looking. You can try that too." },
        { time: 31, text: "Choose one small detail you would usually walk past and focus on it for a brief moment." },
        { time: 37, text: "These sculptures are part of the museum’s garden." },
        { time: 42, text: "But the people stopping to look give this place a different rhythm from the street." },
        { time: 48, text: "Hmm. Maybe the secret of Museumplein is learning to slow down. Although… our next neighbours might disagree." }
      ]
    },
    6: {
      id: 6, pageIndex: 6, title: "The food stalls", subtitle: "Aromas of Museumplein",
      bgImage: "stop2.jpg", interaction: "canvas", taskTime: 31,
      audioSrc: "stop6_food_mp3.mp3",
      lines: [
        { time: 0,  text: "Oh, this is a serious distraction for a pigeon." },
        { time: 3,  text: "Take a gentle breath." },
        { time: 5,  text: "What can you smell today? Something sweet? Coffee?" },
        { time: 9,  text: "Something cooking?" },
        { time: 11, text: "You might find stroopwafels, poffertjes, or other snacks around here." },
        { time: 15, text: "But let your nose investigate before I make promises." },
        { time: 18, text: "Listen too. Can you separate the sound of cooking from the conversations around you?" },
        { time: 26, text: "If you already have a snack or drink, take a small taste." },
        { time: 30, text: "Is it sweet, salty, bitter, warm, or cool?" },
        { time: 34, text: "If not, think of a familiar flavour that these smells remind you of." },
        { time: 40, text: "Some people come here for a famous painting. Others need lunch and somewhere to sit." },
        { time: 46, text: "Both are part of life on the square. I’m beginning to think every visitor brings a different Museumplein experience with them." }
      ]
    },
    14: {
      id: 14, pageIndex: 14, title: "Women of Ravensbrück", subtitle: "Memorial to remember",
      bgImage: "stop3.jpg", interaction: "text", taskTime: 24,
      audioSrc: "stop14_memorial_mp3.mp3",
      lines: [
        { time: 0,  text: "This memorial commemorates the Dutch victims of Ravensbrück concentration camp and resistance to fascism." },
        { time: 9,  text: "Notice the upright metal surfaces and the commemorative lettering. Take your time." },
        { time: 16, text: "As your position changes, you may see light and reflections change across the metal." },
        { time: 23, text: "You can remain where you are and watch or move a little along the accessible path." },
        { time: 29, text: "Listen to the surroundings. The wind, footsteps, and everyday activity continue while we stand here remembering." },
        { time: 39, text: "I don’t think I can reduce this square to one answer anymore." },
        { time: 45, text: "It holds joyful moments, ordinary routines, and histories we must remember. Each needs space." },
        { time: 52, text: "When you’re ready, let’s find somewhere to sit." }
      ]
    }
  };

  let currentStopKey = 3;
  let currentLineIndex = -1;
  let isPlaying = false;
  let currentAudio = new Audio();
  let isTextHidden = false;
  let taskCompleted = false;
  let findMyInterval = null;
  let isMapView = false;

  const titleEl = document.getElementById('ui-title');
  const subtitleEl = document.getElementById('ui-subtitle');
  const distanceEl = document.getElementById('ui-distance');
  const statusEl = document.getElementById('ui-status');
  const arrowSvg = document.getElementById('arrow-svg');
  const bgImageEl = document.getElementById('bg-image');
  const lyricsContainer = document.getElementById('lyrics-container');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');
  const progressFill = document.getElementById('ui-progress');
  const mapToggleBtn = document.getElementById('map-toggle');
  const bgMapEl = document.getElementById('bg-map');
  const collapsibleText = document.getElementById('collapsible-text');
  const userInputBox = document.getElementById('user-input-box');
  const canvasLayer = document.getElementById('canvas-layer');
  const topUiContainer = document.getElementById('top-ui-container');
  const paginatorDotsContainer = document.getElementById('paginator-dots-container');
  const paginatorNumbers = document.getElementById('paginator-numbers');

  function buildPaginator(activeIndex) {
    if (!paginatorDotsContainer) return;
    paginatorDotsContainer.innerHTML = '';
    
    // Voeg stipjes toe
    for(let i=1; i<=15; i++){
      let dot = document.createElement('div');
      dot.className = i === activeIndex ? 'page-dot active' : 'page-dot';
      dot.onclick = () => {
        if(i === 3) loadStop(3, true);
        if(i === 6) loadStop(6, true);
        if(i === 14) loadStop(14, true);
      };
      paginatorDotsContainer.appendChild(dot);
    }
    
    // Voeg cijfer aanduiding toe
    if (paginatorNumbers) {
      paginatorNumbers.textContent = `${activeIndex} / 15`;
    }
  }

  function loadStop(key, autoPlay = false) {
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
    isPlaying = false;
    taskCompleted = false;
    updatePlayPauseUI();
    
    currentStopKey = key;
    currentLineIndex = -1;
    const stop = stopsData[key];

    buildPaginator(stop.pageIndex);
    titleEl.textContent = stop.title;
    subtitleEl.textContent = stop.subtitle;
    bgImageEl.style.backgroundImage = `url('${stop.bgImage}')`;
    progressFill.style.width = '0%';
    
    canvasLayer.classList.remove('active');
    userInputBox.classList.remove('active');
    topUiContainer.style.opacity = '1';
    mapToggleBtn.style.opacity = '1';
    if(isTextHidden) toggleText();

    currentAudio.src = stop.audioSrc;
    lyricsContainer.innerHTML = '';
    stop.lines.forEach((lineData) => {
      const div = document.createElement('div');
      div.className = 'lyric-line';
      div.textContent = lineData.text;
      div.onclick = () => jumpToTime(lineData.time);
      lyricsContainer.appendChild(div);
    });

    if (isMapView) toggleMap();
    startFindMyAnimation();
    highlightLine(0);

    if (autoPlay) togglePlay();
  }

  function startFindMyAnimation() {
    clearInterval(findMyInterval);
    let distance = 25;
    statusEl.textContent = "Walking towards";
    distanceEl.style.display = "block";
    distanceEl.textContent = distance + " METER";
    
    arrowSvg.innerHTML = `<path d="M4.23572 24.0077C3.96357 24.7902 4.37724 25.6451 5.15968 25.9172C5.94213 26.1894 6.79706 25.7757 7.06921 24.9933L5.65247 24.5005L4.23572 24.0077ZM15.0027 0.847147C14.6419 0.101431 13.7448 -0.210581 12.9991 0.15025L0.846974 6.03032C0.101257 6.39115 -0.210754 7.28819 0.150076 8.0339C0.510907 8.77962 1.40794 9.09163 2.15366 8.7308L12.9556 3.50407L18.1823 14.306C18.5431 15.0517 19.4402 15.3637 20.1859 15.0029C20.9316 14.642 21.2436 13.745 20.8828 12.9993L15.0027 0.847147ZM5.65247 24.5005L7.06921 24.9933L15.0692 1.99327L13.6525 1.50049L12.2357 1.00771L4.23572 24.0077L5.65247 24.5005Z" fill="#6606FF"/>`;
    arrowSvg.classList.add('wobble');

    findMyInterval = setInterval(() => {
      distance -= 1;
      if (distance > 0) {
        distanceEl.textContent = distance + " METER";
      } else {
        clearInterval(findMyInterval);
        statusEl.textContent = "Standing at";
        distanceEl.style.display = "none";
        arrowSvg.classList.remove('wobble');
        arrowSvg.innerHTML = `<path d="M11 0C5.5 0 1 4.5 1 10C1 17.5 11 26 11 26C11 26 21 17.5 21 10C21 4.5 16.5 0 11 0ZM11 13.5C9.1 13.5 7.5 11.9 7.5 10C7.5 8.1 9.1 6.5 11 6.5C12.9 6.5 14.5 8.1 14.5 10C14.5 11.9 12.9 13.5 11 13.5Z" fill="#6606FF"/>`;
      }
    }, 400); 
  }

  function toggleText() {
    isTextHidden = !isTextHidden;
    if (isTextHidden) collapsibleText.classList.add('hidden');
    else collapsibleText.classList.remove('hidden');
  }

  function updatePlayPauseUI() {
    if (isPlaying) {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    } else {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }
  }

  function togglePlay() {
    if (isPlaying) {
      currentAudio.pause();
      isPlaying = false;
      updatePlayPauseUI();
    } else {
      currentAudio.play().then(() => {
        isPlaying = true;
        updatePlayPauseUI();
      });
    }
  }

  currentAudio.ontimeupdate = () => {
    if (!currentAudio.duration) return;
    
    progressFill.style.width = (currentAudio.currentTime / currentAudio.duration) * 100 + '%';
    
    const stop = stopsData[currentStopKey];
    if (currentAudio.currentTime >= stop.taskTime && !taskCompleted) {
      currentAudio.pause();
      isPlaying = false;
      updatePlayPauseUI();
      triggerTask(stop.interaction);
    }

    const lines = stop.lines;
    let activeIdx = 0;
    for (let i = 0; i < lines.length; i++) {
      if (currentAudio.currentTime >= lines[i].time) activeIdx = i;
      else break;
    }
    
    if (activeIdx !== currentLineIndex) highlightLine(activeIdx);
  };

  currentAudio.onended = () => {
    isPlaying = false;
    updatePlayPauseUI();
  };

  function triggerTask(type) {
    if (type === 'canvas') {
      canvasLayer.classList.add('active');
      topUiContainer.style.opacity = '0';
      mapToggleBtn.style.opacity = '0';
      topUiContainer.style.pointerEvents = 'none';
      if (!isTextHidden) toggleText();
      
      // FIX: Wacht 450ms tot de tekst-inklap animatie (0.4s) he-le-maal klaar is
      setTimeout(() => {
        resizeCanvas();
      }, 450);
    } else {
      userInputBox.classList.add('active');
      // Scroll direct naar input zodat user het ziet
      lyricsContainer.scrollTo({ top: lyricsContainer.scrollHeight, behavior: 'smooth' });
    }
  }

  function completeTask() {
    taskCompleted = true;
    canvasLayer.classList.remove('active');
    userInputBox.classList.remove('active');
    
    topUiContainer.style.opacity = '1';
    mapToggleBtn.style.opacity = '1';
    topUiContainer.style.pointerEvents = 'auto';
    
    if (isTextHidden) toggleText();
    togglePlay();
  }

  function highlightLine(index) {
    currentLineIndex = index;
    const lines = lyricsContainer.getElementsByClassName('lyric-line');
    for (let i = 0; i < lines.length; i++) {
      if (i === index) {
        lines[i].classList.add('active');
        const scrollPos = lines[i].offsetTop - (lyricsContainer.clientHeight / 2) + (lines[i].clientHeight / 2);
        lyricsContainer.scrollTo({ top: scrollPos, behavior: 'smooth' });
      } else {
        lines[i].classList.remove('active');
      }
    }
  }

  function jumpToTime(seconds) {
    if (currentAudio) {
      currentAudio.currentTime = seconds;
      if (!isPlaying) togglePlay();
    }
  }

  function skipTime(seconds) {
    if (currentAudio.duration) {
      currentAudio.currentTime = Math.min(Math.max(currentAudio.currentTime + seconds, 0), currentAudio.duration);
    }
  }

  function nextStop() {
    if (currentStopKey === 3) loadStop(6, true);
    else if (currentStopKey === 6) loadStop(14, true);
    else loadStop(3, true);
  }

  function prevStop() {
    if (currentStopKey === 14) loadStop(6, true);
    else if (currentStopKey === 6) loadStop(3, true);
    else loadStop(14, true);
  }

  const progressTrack = document.getElementById('progress-track');
  function scrub(e) {
    if (currentAudio.duration) {
      const rect = progressTrack.getBoundingClientRect();
      const clickX = (e.clientX || e.touches[0].clientX) - rect.left;
      const percent = Math.max(0, Math.min(clickX / rect.width, 1));
      currentAudio.currentTime = percent * currentAudio.duration;
    }
  }
  
  let isDragging = false;
  progressTrack.addEventListener('mousedown', (e) => { isDragging = true; scrub(e); });
  window.addEventListener('mouseup', () => isDragging = false);
  window.addEventListener('mousemove', (e) => { if (isDragging) scrub(e); });
  
  progressTrack.addEventListener('touchstart', (e) => { isDragging = true; scrub(e); });
  window.addEventListener('touchend', () => isDragging = false);
  window.addEventListener('touchmove', (e) => { if (isDragging) scrub(e); });

  function toggleMap() {
    isMapView = !isMapView;
    if (isMapView) {
      bgMapEl.style.opacity = '1';
      bgMapEl.style.pointerEvents = 'auto';
      mapToggleBtn.style.backgroundColor = 'white';
      mapToggleBtn.style.color = 'var(--purple)';
    } else {
      bgMapEl.style.opacity = '0';
      bgMapEl.style.pointerEvents = 'none';
      mapToggleBtn.style.backgroundColor = 'var(--purple)';
      mapToggleBtn.style.color = 'white';
    }
  }
  mapToggleBtn.addEventListener('click', toggleMap);

  // Teken Canvas Init
  const canvas = document.getElementById('drawing-pad');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let currentStrokeColor = '#000000'; // Onthoud de kleur na een resize

  function resizeCanvas() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = currentStrokeColor;
  }
  window.addEventListener('resize', resizeCanvas);

  function setColor(color) { 
    currentStrokeColor = color;
    ctx.strokeStyle = color; 
  }

  canvas.addEventListener('mousedown', startPos);
  canvas.addEventListener('mouseup', endPos);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); 
    const touch = e.touches[0];
    startPos(new MouseEvent("mousedown", { clientX: touch.clientX, clientY: touch.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchend', (e) => {
    e.preventDefault(); endPos();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    draw(new MouseEvent("mousemove", { clientX: touch.clientX, clientY: touch.clientY }));
  }, { passive: false });

  // FIX: Rekening houden met uitgerekte verhoudingen via schaalberekening
  function startPos(e) { 
    isDrawing = true; 
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    ctx.beginPath();
    ctx.moveTo((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY);
    draw(e); 
  }
  
  function endPos() { 
    isDrawing = false; 
    ctx.beginPath(); 
  }
  
  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    
    // Bereken de exacte locatie, ongeacht de canvas flex-grootte
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  loadStop(3);
</script>
</body>
</html>
